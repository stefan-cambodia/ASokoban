org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle 9.7 refuses very recent JDKs (e.g. JDK 26). If the system JDK is too
# new, run Gradle with Android Studio's bundled runtime:
#   JAVA_HOME=/opt/android-studio/jbr ./gradlew ...
# or uncomment the line below (machine-specific path, do not share).
# org.gradle.java.home=/opt/android-studio/jbr
